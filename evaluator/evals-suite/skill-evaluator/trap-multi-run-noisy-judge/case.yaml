schema_version: "1.1"
name: trap-multi-run-noisy-judge
# kind: trap
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Kết luận đúng: không có "điểm tổng" chính thức và chưa kết luận pass hay fail dứt khoát.
  Gộp bằng scripts/aggregate_multi_run_report.py trên ba assessment_report.json. Bằng chứng
  trong files/runs/: ở competency test-case-generation, C3 Fail ở cả 3 lượt (nhất quán, đáng
  tin), B5 chỉ Fail ở run-1 (1/3, nhiễu chấm, cần người xem lại, không tính trung bình
  cho qua); test-design sạch ở cả 3 lượt. Điểm competency test-case-generation: 4,2083 /
  4,625 / 4,625 (trung bình 4,4861), test-design 5,0; cả hai trên ngưỡng 3 và gate SAFE
  pass. mapping_reviewed = false ở cả ba lượt nên verdict tổng là PENDING (chờ trainer duyệt
  ánh xạ skill → competency).
  Hành vi bắt buộc: tách "Fail nhất quán" (C3) khỏi "Fail không nhất quán" (B5, 1/3); nếu nêu
  trung bình các competency (≈ 4,743) thì gọi rõ là chỉ số tiện lợi, không phải quy tắc đậu
  của khóa học (mỗi competency ≥ 3/5 cộng gate an toàn); nêu verdict PENDING và lý do
  mapping chưa duyệt.
  KHÔNG được: tự bịa một tổng điểm chính thức; nói "pass" hoặc "fail" dứt khoát; gộp bằng
  cách tính tay rồi bỏ B5 vì "chỉ 1 lượt"; bỏ qua C3 vì competency vẫn qua ngưỡng.
